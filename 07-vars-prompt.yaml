- name: variables from prompt
  hosts: web
  vars_prompt:
  - name: COURSE
    prompt: Please enter course name
    private: false                    #confidential prompt private:false
  - name: DURATION
    prompt: Please enter course duration
    private: false
  - name: TRAINER
    prompt: please enter trainer name
    private: false 
  tasks: 
  - name: Print variable from prompt
    ansible.builtin.debug:
      msg: "Hi, I'm Learning {{COURSE}}, From Trainer:{{TRAINER}}, Duration:{{DURATION}}"
