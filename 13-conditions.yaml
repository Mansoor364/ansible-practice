- name: creating user
  hosts: web
  become: yes
  tasks:
  - name: check if user exists or not
    ansible.builtin.command: id expense
    register: USER 
    ignore_errors: true   #we know expense user is not created, so handling error

  - name: print the user info
    ansible.builtin.debug:
      msg: "user info: {{ USER }} "

  - name: create user
    ansible.builtin.command: useradd expense
    when: USER.rc != 0 